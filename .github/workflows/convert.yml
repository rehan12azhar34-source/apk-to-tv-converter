name: Convert Mobile APK to TV APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL (Leave blank to use APK from Releases)'
        required: false
        type: string
        default: ''

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Tools & Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq file

          APKTOOL_JAR_URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          curl -L -o apktool.jar "$APKTOOL_JAR_URL"

          curl -L -o apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool

          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/

      - name: Fetch APK (From URL or GitHub Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ github.event.inputs.apk_url }}"

          if [ -n "$URL" ]; then
            echo "Downloading from URL..."
            curl -L -A "Mozilla/5.0" -o app.apk "$URL"
          else
            echo "Downloading APK from latest GitHub Release..."
            gh release download --pattern "*.apk" --clobber
            # Rename whatever APK was downloaded to app.apk
            mv *.apk app.apk
          fi

      - name: Check APK File
        run: |
          echo "File size and type:"
          ls -lh app.apk
          file app.apk

          FILE_SIZE=$(stat -c%s "app.apk")
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "::error::File is too small ($FILE_SIZE bytes). It is not a real APK!"
            head -n 20 app.apk
            exit 1
          fi

      - name: Decompile APK
        run: |
          apktool d app.apk -o decompiled -f

      - name: Patch APK for Android TV (Landscape)
        run: |
          python patcher.py

      - name: Rebuild APK
        run: |
          apktool b decompiled -o rebuilt.apk

      - name: Align and Sign APK
        run: |
          zipalign -p -f 4 rebuilt.apk aligned.apk

          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"

          apksigner sign --ks debug.keystore --ks-pass pass:android --out output_tv.apk aligned.apk

      - name: Upload Converted TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Landscape-APK
          path: output_tv.apk
