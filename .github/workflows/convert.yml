name: Convert Mobile APK to TV APK

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Tools & Latest Apktool from GitHub
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq

          # 1. Fetch latest official Apktool release directly from GitHub Releases
          APKTOOL_JAR_URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          echo "Downloading Apktool from: $APKTOOL_JAR_URL"
          curl -L -o apktool.jar "$APKTOOL_JAR_URL"

          # 2. Download the official Linux wrapper script
          curl -L -o apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool

          # 3. Move both to binary PATH
          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/

          # 4. Verify Apktool is working
          apktool --version

      - name: Verify APK Exists
        run: |
          if [ ! -f "app.apk" ]; then
            echo "ERROR: 'app.apk' was not found in the root of your repository."
            echo "Please upload your APK and ensure it is named exactly 'app.apk'"
            exit 1
          fi

      - name: Decompile APK
        run: |
          # Decompile with Apktool (--no-crunch avoids AAPT image errors)
          apktool d app.apk -o decompiled -f --no-crunch

      - name: Patch APK for Android TV (Landscape)
        run: |
          python patcher.py

      - name: Rebuild APK
        run: |
          apktool b decompiled -o rebuilt.apk --use-aapt2

      - name: Align and Sign APK
        run: |
          zipalign -p -f 4 rebuilt.apk aligned.apk

          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"

          apksigner sign --ks debug.keystore --ks-pass pass:android --out output_tv.apk aligned.apk

      - name: Upload Converted TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Landscape-APK
          path: output_tv.apk
