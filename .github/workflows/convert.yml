name: Convert Mobile APK to TV APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct download URL to APK (Leave blank to use app.apk from repo)'
        required: false
        type: string
        default: ''

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # Pulls files from repo (and downloads real binary if using Git LFS)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Tools & Latest Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner curl jq file

          # Download latest official Apktool release
          APKTOOL_JAR_URL=$(curl -s https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url')
          curl -L -o apktool.jar "$APKTOOL_JAR_URL"

          curl -L -o apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool
          chmod +x apktool

          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/
          apktool --version

      - name: Acquire APK (URL or Repo file)
        run: |
          URL="${{ github.event.inputs.apk_url }}"

          if [ -n "$URL" ]; then
            echo "URL provided! Downloading APK from URL..."
            curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              -o app.apk "$URL"
          else
            echo "No URL provided. Looking for 'app.apk' in repo root..."
            if [ ! -f "app.apk" ]; then
              echo "::error::No URL was entered AND 'app.apk' was not found in the repository root!"
              echo "Please either paste a direct download URL OR upload 'app.apk' to the repo."
              exit 1
            fi
            echo "Using existing 'app.apk' from repository."
          fi

      - name: Verify APK Integrity
        run: |
          echo "--- File Details ---"
          ls -lh app.apk
          file app.apk

          # 1. Check if file is too small (e.g., text pointer, 404 HTML, or 0 bytes)
          FILE_SIZE=$(stat -c%s "app.apk")
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "::error::The APK file is only $FILE_SIZE bytes! It is not a real APK archive."
            echo "File contents preview:"
            head -n 20 app.apk
            exit 1
          fi

          # 2. Check if file is a valid zip archive
          if ! file app.apk | grep -iqE "zip|android"; then
            echo "::error::The file is not a valid APK/ZIP format. (Detected as: $(file app.apk))"
            echo "If you used a URL, the site likely served an HTML error or Cloudflare bot page."
            head -n 20 app.apk
            exit 1
          fi

      - name: Decompile APK
        run: |
          apktool d app.apk -o decompiled -f

      - name: Patch APK for Android TV (Landscape)
        run: |
          python patcher.py

      - name: Rebuild APK
        run: |
          apktool b decompiled -o rebuilt.apk

      - name: Align and Sign APK
        run: |
          zipalign -p -f 4 rebuilt.apk aligned.apk

          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"

          apksigner sign --ks debug.keystore --ks-pass pass:android --out output_tv.apk aligned.apk

      - name: Upload Converted TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-Landscape-APK
          path: output_tv.apk
